#!name=汽水音乐 · 激励广告配置改写
#!desc=订阅脚本入口用；内容与 soda-noads.plugin 一致（新语法）
#!author=海鸥
#!system=ios
#!homepage=https://github.com/taiyuan0324/zy

[Script]
response if ${url} ~= /^https?:\/\/api\.qishui\.com\/luna\/ads\/config/ then script("https://raw.githubusercontent.com/taiyuan0324/zy/main/soda/scripts/soda.js?v=3") with tag="汽水-广告总配置", timeout=30, requires_body=true, enable=true
response if ${url} ~= /^https?:\/\/beta-luna\.douyin\.com\/luna\/advert\/incentive\/config/ then script("https://raw.githubusercontent.com/taiyuan0324/zy/main/soda/scripts/soda.js?v=3") with tag="汽水-激励配置", timeout=30, requires_body=true, enable=true
response if ${url} ~= /^https?:\/\/beta-luna\.douyin\.com\/luna\/advert\/incentive\/retrieve/ then script("https://raw.githubusercontent.com/taiyuan0324/zy/main/soda/scripts/soda.js?v=3") with tag="汽水-广告素材", timeout=30, requires_body=true, enable=true
response if ${url} ~= /^https?:\/\/api\.qishui\.com\/luna\/advert\/incentive\/done/ then script("https://raw.githubusercontent.com/taiyuan0324/zy/main/soda/scripts/soda.js?v=3") with tag="汽水-领奖回调", timeout=30, requires_body=true, enable=true
response if ${url} ~= /^https?:\/\/beta-luna\.douyin\.com\/{1,2}luna\/advert\/fallback\/done\/info/ then script("https://raw.githubusercontent.com/taiyuan0324/zy/main/soda/scripts/soda.js?v=3") with tag="汽水-兜底token", timeout=30, requires_body=true, enable=true
request if ${url} ~= /^https?:\/\/api\.qishui\.com\/luna\/advert\/incentive\/done/ then script("https://raw.githubusercontent.com/taiyuan0324/zy/main/soda/scripts/soda.js?v=3") with tag="汽水-领奖请求观测", timeout=30, requires_body=true, enable=true

[MITM]
hostname = api.qishui.com, beta-luna.douyin.com
